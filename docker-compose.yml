version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    networks:
      - spacex-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - spacex-network

networks:
  spacex-network:
    driver: bridge